<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1 John Greek Vocabulary Drill</title>
  
  <!-- Professional Biblical Greek Font for Perfect iPhone Diacritic Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gentium+Plus:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --primary: #1d3557;
      --accent: #457b9d;
      --success: #2a9d8f;
      --error: #e76f51;
      --warning: #f4a261;
      --text: #2b2d42;
      --border: #e9ecef;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      color: var(--primary);
      text-align: center;
      margin-bottom: 20px;
    }

    .hidden { display: none !important; }

    .form-group { margin-bottom: 20px; }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .freq-inputs {
      display: flex;
      gap: 15px;
    }

    .freq-inputs div { flex: 1; }

    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      background-color: var(--primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover { background-color: var(--accent); }
    .btn:active { transform: scale(0.99); }
    .btn-secondary { background-color: var(--accent); margin-top: 10px; }
    .btn-warning { background-color: var(--warning); margin-top: 10px; }
    .btn-outline { background: transparent; color: var(--text); border: 2px solid var(--border); }
    .btn-outline:hover { background: var(--border); }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 0.95rem;
      color: #6c757d;
    }

    .pause-btn {
      width: auto;
      padding: 6px 14px;
      font-size: 0.9rem;
    }

    .greek-word {
      font-family: 'Gentium Plus', 'Times New Roman', serif;
      font-size: 3.2rem;
      font-weight: bold;
      color: var(--primary);
      text-align: center;
      margin: 15px 0;
      line-height: 1.2;
    }

    .feedback-card {
      margin: 15px 0;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }

    .feedback-card.correct { background: #e8f5e9; color: var(--success); }
    .feedback-card.incorrect { background: #ffebee; color: var(--error); }

    .result-status {
      font-size: 1.4rem;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .correct-ans {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent);
    }

    .details-box {
      margin-top: 15px;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 10px;
      border-left: 5px solid var(--accent);
      font-size: 0.95rem;
      line-height: 1.5;
      max-height: 280px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .details-box h4 {
      color: var(--primary);
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    .paradigm-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.88rem;
      font-family: 'Gentium Plus', serif;
    }

    .paradigm-table th, .paradigm-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
    }

    .paradigm-table th {
      background-color: #e9ecef;
      color: var(--primary);
      font-family: -apple-system, sans-serif;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.95);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 10;
    }

    .results-score {
      font-size: 2rem;
      font-weight: bold;
      margin: 15px 0;
      color: var(--primary);
    }

      .app-container { padding: 18px; }
      .greek-word { font-size: 2.6rem; }
      .btn { padding: 12px; font-size: 1rem; }
      .paradigm-table { font-size: 0.82rem; }
    }
  </style>
</head>

<div class="app-container">

  <!-- CONFIGURATION SCREEN -->
  <div id="config-screen">
    <h1>1 John Greek Vocabulary Drill</h1>
    <div class="form-group">
      <label>New Testament Frequency Range (1 - 49)</label>
      <div class="freq-inputs">
        <div>
          <label for="min-freq">Min</label>
          <input type="number" id="min-freq" value="1" min="1" max="49">
        </div>
        <div>
          <label for="max-freq">Max</label>
          <input type="number" id="max-freq" value="49" min="1" max="49">
        </div>
      </div>
    </div>
    <button class="btn" onclick="startQuiz()">Start Quiz</button>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen" class="hidden">
    <div class="status-bar">
      <span id="progress-text">Word 1 of 10</span>
      <span id="freq-text">Freq: 49</span>
      <button class="btn btn-outline pause-btn" onclick="togglePause()">Pause ❚❚</button>
    </div>

    <div class="greek-word" id="greek-display">φανερόω</div>

    <div class="form-group">
      <input type="text" id="answer-input" placeholder="Type English translation..." autocomplete="off" autocapitalize="none">
    </div>

    <button id="submit-btn" class="btn" onclick="checkAnswer()">Submit Answer</button>

    <!-- Feedback Container -->
    <div id="feedback-area" class="hidden">
      <div id="feedback-card" class="feedback-card">
        <div id="result-status" class="result-status"></div>
        <div id="correct-ans" class="correct-ans"></div>
      </div>

      <button id="detail-btn" class="btn btn-secondary" onclick="toggleDetails()">Show Grammar Details</button>
      
      <div id="details-box" class="details-box hidden"></div>

      <button id="next-btn" class="btn btn-outline" style="margin-top:15px;" onclick="nextWord()">Next Word ➔</button>
    </div>
  </div>

  <!-- PAUSE OVERLAY -->
  <div id="pause-overlay" class="overlay hidden">
    <h2>Quiz Paused</h2>
    <button class="btn btn-secondary" style="width:200px; margin-top:20px;" onclick="togglePause()">Resume</button>
    <button class="btn btn-outline" style="width:200px; margin-top:10px;" onclick="restartToMenu()">Main Menu</button>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="results-screen" class="hidden">
    <h1>Quiz Completed!</h1>
    <div id="final-score" class="results-score">8 / 10</div>
    <p id="error-summary" style="margin-bottom:20px; color:#6c757d;"></p>
    
    <button id="retry-errors-btn" class="btn btn-warning hidden" onclick="startQuiz(true)">Practice Missed Words Only</button>
    <button class="btn btn-outline" style="margin-top:10px;" onclick="restartToMenu()">Main Menu</button>
  </div>

</div>

  let currentPool = [];
  let missedWords = [];
  let currentIndex = 0;
  let score = 0;

  document.getElementById('answer-input').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      if (document.getElementById('feedback-area').classList.contains('hidden')) {
        checkAnswer();
      } else {
        nextWord();
      }
    }
  });

  function startQuiz(retryErrors = false) {
    if (retryErrors) {
      currentPool = [...missedWords];
    } else {
      const minF = parseInt(document.getElementById('min-freq').value) || 1;
      const maxF = parseInt(document.getElementById('max-freq').value) || 49;
      
      currentPool = VOCABULARY.filter(w => w.freq >= minF && w.freq <= maxF);
      
      if (currentPool.length === 0) {
        alert("No words found in that frequency range!");
        return;
      }
    }

    currentPool.sort(() => Math.random() - 0.5);
    
    missedWords = [];
    currentIndex = 0;
    score = 0;

    showScreen('quiz-screen');
    loadWord();
  }

  function loadWord() {
    if (currentIndex >= currentPool.length) {
      showResults();
      return;
    }

    const word = currentPool[currentIndex];
    
    document.getElementById('progress-text').innerText = `Word ${currentIndex + 1} of ${currentPool.length}`;
    document.getElementById('freq-text').innerText = `NT Freq: ${word.freq}`;
    
    const displayEl = document.getElementById('greek-display');
    displayEl.innerText = (word.greek || "").normalize('NFC');
    
    const input = document.getElementById('answer-input');
    input.value = '';
    input.disabled = false;
    input.focus();

    document.getElementById('feedback-area').classList.add('hidden');
    document.getElementById('submit-btn').classList.remove('hidden');
    document.getElementById('details-box').classList.add('hidden');
    document.getElementById('detail-btn').innerText = "Show Grammar Details";
  }

  function checkAnswer() {
    const userInput = document.getElementById('answer-input').value.trim().toLowerCase();
    if (!userInput) return;

    const word = currentPool[currentIndex];
    const validGloss = word.english.toLowerCase().split(',').map(s => s.trim());
    
    const cleanInput = userInput.replace(/^(i\s+|to\s+)/, '');
    
    // Strict validation logic:
    // Requires exact match OR length >= 3 for sub-word matching to prevent single-letter false positives
    const isCorrect = validGloss.some(g => {
      const cleanG = g.replace(/^(i\s+|to\s+)/, '');
      if (cleanInput === cleanG) return true;
      if (cleanInput.length >= 3 && cleanG.includes(cleanInput)) return true;
      return false;
    });

    const card = document.getElementById('feedback-card');
    const status = document.getElementById('result-status');
    const ans = document.getElementById('correct-ans');

    if (isCorrect) {
      score++;
      card.className = "feedback-card correct";
      status.innerText = "✓ Correct!";
    } else {
      missedWords.push(word);
      card.className = "feedback-card incorrect";
      status.innerText = "✗ Incorrect";
    }

    ans.innerText = `Definition: ${word.english}`;
    
    document.getElementById('answer-input').disabled = true;
    document.getElementById('submit-btn').classList.add('hidden');
    document.getElementById('feedback-area').classList.remove('hidden');

    renderGrammarDetails(word);
  }

  function renderGrammarDetails(word) {
    const box = document.getElementById('details-box');
    let html = `<h4>Part of Speech: ${word.type.toUpperCase()}</h4>`;

    if (word.type === "verb" && word.details.principal_parts) {
      const labels = ["1st (Present)", "2nd (Future)", "3rd (Aorist Act)", "4th (Perf Act)", "5th (Perf Mid/Pass)", "6th (Aor Pass)"];
      html += `<p><strong>6 Principal Parts Paradigm:</strong></p>`;
      html += `<table class="paradigm-table"><tr><th>Tense / Voice</th><th>Form</th></tr>`;
      word.details.principal_parts.forEach((part, idx) => {
        html += `<tr><td>${labels[idx] || 'Part ' + (idx+1)}</td><td><strong>${part}</strong></td></tr>`;
      });
      html += `</table>`;
    } 
    else if (["noun", "adjective", "pronoun", "adjective / noun", "proper noun", "pronoun / adjective"].includes(word.type)) {
      html += `<p><strong>Declension Pattern:</strong> ${word.details.declension || 'N/A'}</p>`;
      if (word.details.cases) {
        const hasPlural = word.details.cases.pl !== undefined;
        html += `<p style="margin-top:8px;"><strong>Case Paradigm:</strong></p>`;
        html += `<table class="paradigm-table"><tr><th>Case</th><th>Singular</th>${hasPlural ? '<th>Plural</th>' : ''}</tr>`;
        
        const casesList = ["Nom", "Gen", "Dat", "Acc"];
        casesList.forEach(c => {
          if (word.details.cases.sg && word.details.cases.sg[c]) {
            html += `<tr><td><strong>${c}.</strong></td><td>${word.details.cases.sg[c]}</td>`;
            if (hasPlural) {
              html += `<td>${word.details.cases.pl[c] || '-'}</td>`;
            }
            html += `</tr>`;
          }
        });
        html += `</table>`;
      }
    } 
    else if (word.type === "preposition") {
      html += `<p><strong>Usage & Syntax:</strong> ${word.details.case_meaning || 'N/A'}</p>`;
    } else {
      html += `<p>Standard uninflected grammatical form.</p>`;
    }

    box.innerHTML = html;
  }

  function toggleDetails() {
    const box = document.getElementById('details-box');
    const btn = document.getElementById('detail-btn');
    if (box.classList.contains('hidden')) {
      box.classList.remove('hidden');
      btn.innerText = "Hide Grammar Details";
    } else {
      box.classList.add('hidden');
      btn.innerText = "Show Grammar Details";
    }
  }

  function nextWord() {
    currentIndex++;
    loadWord();
  }

  function togglePause() {
    const overlay = document.getElementById('pause-overlay');
    overlay.classList.toggle('hidden');
  }

  function restartToMenu() {
    document.getElementById('pause-overlay').classList.add('hidden');
    showScreen('config-screen');
  }

  function showResults() {
    showScreen('results-screen');
    document.getElementById('final-score').innerText = `${score} / ${currentPool.length}`;

    const retryBtn = document.getElementById('retry-errors-btn');
    const summary = document.getElementById('error-summary');

    if (missedWords.length > 0) {
      summary.innerText = `You missed ${missedWords.length} word(s).`;
      retryBtn.classList.remove('hidden');
      retryBtn.innerText = `Practice ${missedWords.length} Missed Word(s) ↻`;
    } else {
      summary.innerText = "Perfect score! Outstanding job.";
      retryBtn.classList.add('hidden');
    }
  }

  function showScreen(id) {
    ['config-screen', 'quiz-screen', 'results-screen'].forEach(s => {
      document.getElementById(s).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
  }
</script>

</body>
</html>
